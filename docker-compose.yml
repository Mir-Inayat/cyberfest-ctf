services:
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      # Mount database and uploads directly for persistence
      - ./CTFd/ctfd.db:/opt/CTFd/CTFd/ctfd.db
      - ./CTFd/uploads:/opt/CTFd/CTFd/uploads
      # Mount custom frontend files for live updates
      - ./CTFd/themes/core/static/css/ddc-custom.dev.css:/opt/CTFd/CTFd/themes/core/static/css/ddc-custom.dev.css:ro
      - ./CTFd/themes/core/static/js/ddc-particles.dev.js:/opt/CTFd/CTFd/themes/core/static/js/ddc-particles.dev.js:ro
      - ./CTFd/themes/core/static/img/ddc_logo.jpg:/opt/CTFd/CTFd/themes/core/static/img/ddc_logo.jpg:ro
      - ./CTFd/themes/core/static/img/ddc-favicon.png:/opt/CTFd/CTFd/themes/core/static/img/ddc-favicon.png:ro
      - ./CTFd/themes/admin/static/img/favicon.ico:/opt/CTFd/CTFd/themes/admin/static/img/favicon.ico:ro
    depends_on:
      - db
    networks:
        default:
        internal:

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true
